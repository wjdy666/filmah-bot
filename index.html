<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>فِلْمَه - تسجيل الدخول</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(rgba(0, 0, 0, 0.75), rgba(0, 0, 0, 0.75)), url('https://images.unsplash.com/photo-1536440136628-849c177e76a1?q=80&w=1000') no-repeat center center/cover;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
        }

        .login-container {
            background: rgba(0, 0, 0, 0.85);
            padding: 40px;
            border-radius: 10px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 15px 25px rgba(0,0,0,0.5);
            border: 1px solid #e50914;
            text-align: center;
        }

        .login-container h2 {
            margin-bottom: 20px;
            font-size: 28px;
            color: #e50914;
            font-weight: bold;
        }

        .input-group {
            position: relative;
            margin-bottom: 20px;
        }

        .input-group input {
            width: 100%;
            padding: 12px 15px;
            background: #333;
            border: none;
            outline: none;
            color: #fff;
            border-radius: 5px;
            font-size: 16px;
            transition: 0.3s;
            text-align: right;
        }

        .input-group input:focus {
            background: #454545;
            box-shadow: 0 0 5px #e50914;
        }

        .btn-login {
            width: 100%;
            padding: 12px;
            background: #e50914;
            color: #fff;
            border: none;
            outline: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-login:hover {
            background: #b81d24;
        }

        .footer-text {
            margin-top: 20px;
            font-size: 14px;
            color: #b3b3b3;
        }

        .footer-text a {
            color: #fff;
            text-decoration: none;
        }

        .footer-text a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="login-container">
        <h2>فِلْمَه 🎬</h2>
        <p style="margin-bottom: 20px; color: #b3b3b3; font-size: 14px;">سجل دخولك للتحكم في بوت السينما</p>
        
        <form onsubmit="event.preventDefault(); alert('تم تسجيل الدخول بنجاح! جاري الاتصال بالبوت...');">
            <div class="input-group">
                <input type="text" placeholder="اسم المستخدم" required>
            </div>
            <div class="input-group">
                <input type="password" placeholder="كلمة المرور" required>
            </div>
            <button type="submit" class="btn-login">تسجيل الدخول</button>
        </form>

        <div class="footer-text">
            <p>بحاجة للمساعدة؟ <a href="https://t.me/filmah-bot" target="_blank">الدعم الفني للمنصة</a></p>
        </div>
    </div>

</body>
</html>
